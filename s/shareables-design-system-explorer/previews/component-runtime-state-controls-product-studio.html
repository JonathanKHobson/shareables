<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runtime State Controls</title>
  <style>
:root {
  color-scheme: light;
  --radius: 10px;
  --ink: #0f172a;
  --muted: #475569;
  --paper: #f6f8ff;
  --surface: #ffffff;
  --line: #cad6ec;
  --primary: #2563eb;
  --secondary: #0f766e;
  --accent: #0ea5e9;
  --danger: #b91c1c;
  --success: #0ea5a5;
  --focus: #2563eb;
  --font-stack-body: 'Inter', 'Segoe UI', sans-serif;
  --font-stack-heading: 'Inter', 'Segoe UI', sans-serif;
  --shadow: 0 10px 28px -18px rgba(0, 0, 0, 0.45);
  --heading-scale: 1.02;
  --panel-gap: 16px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-stack-body);
}
main.demo-shell {
  width: min(1120px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 28px 0 42px;
  display: grid;
  gap: var(--panel-gap);
}
.eyebrow {
  margin: 0 0 7px;
  color: var(--primary);
  font-size: .82rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .06em;
}
h1 {
  margin: 0;
  font-size: clamp(2rem, 5vw, 4.2rem);
  line-height: 1.02;
  letter-spacing: 0;
  font-family: var(--font-stack-heading);
  font-weight: calc(700 * var(--heading-scale));
}
h2, h3 { overflow-wrap: anywhere; line-height: 1.3; color: var(--ink); }
.lede { color: var(--muted); max-width: 76ch; line-height: 1.55; }
.panel {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select, input, textarea { font: inherit; }
button, .link-button {
  border: 1px solid color-mix(in srgb, var(--primary) 52%, var(--line));
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  padding: 10px 12px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
}
button[aria-pressed="true"], button.primary {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--focus) 42%, white);
  outline-offset: 2px;
}
.chip-row { display:flex; flex-wrap:wrap; gap:8px; }
.chip { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:5px 8px; color:var(--muted); font-size:.82rem; font-weight:800; background:#fff; }
svg { max-width:100%; height:auto; }
table { width: 100%; border-collapse: collapse; }
th, td { border-top: 1px solid var(--line); padding: 9px; text-align: left; vertical-align: top; }
label { display: grid; gap: 6px; font-weight: 700; color: var(--ink); }
input, select, textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px;
  background: var(--surface);
  color: var(--ink);
}
textarea { min-height:96px; resize:vertical; }
pre.output {
  white-space: pre-wrap;
  background: var(--ink);
  color: var(--paper);
  border-radius: 6px;
  padding: 12px;
  overflow: auto;
  min-height: 84px;
}
.bars { display:grid; gap:9px; }
.bar {
  display: grid;
  grid-template-columns: minmax(90px, 0.9fr) minmax(0, 1fr) minmax(42px, 0.45fr);
  align-items: center;
  gap: 9px;
  padding: 8px 4px;
}
.bar i { display:block; height:18px; border-radius:4px; background:var(--primary); }
.status-live { border-left:6px solid #059669; }
.status-stale { border-left:6px solid #d97706; }
.status-offline { border-left:6px solid #dc2626; }
.status-partial { border-left:6px solid #2563eb; }
@media (max-width: 640px) {
  main.demo-shell { width:min(100% - 20px, 1120px); }
  .bar { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration:.01ms!important; animation-duration:.01ms!important; }
}
    </style>
</head>
<body data-style-source="product-studio">
  <main class="demo-shell" data-demo-title="Runtime State Controls">
    <header>
      <p class="eyebrow">Component demo</p>
      <h1>Runtime State Controls</h1>
      <p class="lede">A working component pattern for switching dynamic shareable states with visible reset behavior.</p>
    </header>
    
<section class="panel">
  <div class="controls" role="group" aria-label="Runtime demo controls">
    <button type="button" data-state="overview" aria-pressed="true">Overview</button>
    <button type="button" data-state="detail" aria-pressed="false">Detail</button>
    <button type="button" data-state="fallback" aria-pressed="false">Fallback</button>
    <button type="button" data-reset>Reset</button>
  </div>
</section>
<section class="panel" id="statePanel" aria-live="polite"></section>

  </main>
  <script>
const panel = document.querySelector("#statePanel");
const labels = {
  overview: ["Overview selected", "The default state keeps the main evidence visible."],
  detail: ["Detail selected", "The detail state opens supporting evidence without losing context."],
  fallback: ["Fallback selected", "The fallback state shows the same claim as static text."]
};
function setState(state) {
  document.querySelectorAll("[data-state]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.state === state)));
  panel.innerHTML = `<h2>${labels[state][0]}</h2><p>${labels[state][1]}</p><div class="chip-row"><span class="chip">URL-safe state</span><span class="chip">Keyboard reachable</span><span class="chip">Reset visible</span></div>`;
}
document.querySelectorAll("[data-state]").forEach(button => button.addEventListener("click", () => setState(button.dataset.state)));
document.querySelector("[data-reset]").addEventListener("click", () => setState("overview"));
setState("overview");
</script>
</body>
</html>
