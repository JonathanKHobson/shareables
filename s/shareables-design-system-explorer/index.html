        const show = qOk && statusOk && familyOk;
        card.hidden = !show;
        if(show) count++;
      });
      const empty = $(`[data-empty="${kind}"]`); if (empty) empty.hidden = count > 0;
    }
    function bind() {
      $$('[data-section]').forEach(b=>b.onclick=()=>{state.section=b.dataset.section;state.preview=null;render();});
      $$('[data-open]').forEach(b=>b.onclick=()=>{state.preview=b.dataset.open;render();$('#content').focus({preventScroll:true});});
      $$('[data-back]').forEach(b=>b.onclick=()=>{state.preview=null;render();});
      $$('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render();});
      $$('[data-full]').forEach(b=>b.onclick=()=>{const href=pageHref(state.preview); if(href){window.open(href, '_blank'); return;} if(!pageRecord(state.preview)){b.textContent='No preview yet';return;} const w=window.open('', '_blank'); if(!w){b.textContent='Pop-up blocked';return;} w.document.open(); w.document.write(pageHtml(state.preview)); w.document.close();});
      $$('[data-search]').forEach(input=>{ applySearch(input.dataset.search); input.oninput=()=>{state.searches[input.dataset.search]=input.value;applySearch(input.dataset.search);}; });
      $$('[data-status-filter]').forEach(select=>{ select.onchange=()=>{const kind=select.dataset.statusFilter; state.filters[kind]={...(state.filters[kind]||{}), status:select.value}; applySearch(kind);}; });
      $$('[data-family-filter]').forEach(select=>{ select.onchange=()=>{const kind=select.dataset.familyFilter; state.filters[kind]={...(state.filters[kind]||{}), family:select.value}; applySearch(kind);}; });
      $('#system').onchange=e=>{state.system=e.target.value;render();};
      $$('[data-mobile-system]').forEach(select=>select.onchange=e=>{state.system=e.target.value;render();});
      $('#previewSystem')?.addEventListener('change', e=>{state.system=e.target.value;render();});
      $$('[data-system-card]').forEach(b=>b.onclick=()=>{state.system=b.dataset.systemCard;render();});
    }
    async function hydrateLazyEvidence() {
      if (!DATA.lazy_mode || location.protocol === 'file:') return;
      try {
        const response = await fetch('preview-index.json', {cache:'no-store'});
        if (!response.ok) return;
        const previewIndex = await response.json();
        DATA.preview_index = previewIndex;
        render();
      } catch (error) {
        console.warn('Shareables explorer evidence hydration skipped', error);
      }
    }
    render();
    hydrateLazyEvidence();
  </script>
</body>
</html>
