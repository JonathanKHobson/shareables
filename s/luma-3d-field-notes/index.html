<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Lumina 3D Field Notes</title>
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=../lumina-3d-field-notes/">
  <link rel="canonical" href="https://jonathankhobson.github.io/shareables/s/lumina-3d-field-notes/">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111724;
      --panel: #182132;
      --text: #f8efd8;
      --muted: #c8bfa9;
      --accent: #85d4ff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 30% 20%, rgba(133, 212, 255, 0.22), transparent 34%),
        linear-gradient(140deg, #0b1020, var(--bg));
      color: var(--text);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 560px;
      padding: 28px;
      border: 1px solid rgba(248, 239, 216, 0.18);
      border-radius: 14px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
  <script>
    window.location.replace("../lumina-3d-field-notes/");
  </script>
</head>
<body>
  <main>
    <h1>Lumina 3D Field Notes moved</h1>
